# tmux configuration.
#
# Dracula theme and status bar come from the dracula/tmux plugin;
# all plugins are managed by TPM (cloned machine-local by the
# Makefile, installed via `make install`).

## --- Plugins
# tpm: plugin manager; clones the others below
set -g @plugin 'tmux-plugins/tpm'
# sensible: safe opinionated defaults (status, bell, ...)
set -g @plugin 'tmux-plugins/tmux-sensible'
# resurrect: manual save/restore of windows, panes, processes
set -g @plugin 'tmux-plugins/tmux-resurrect'
# open: open a highlighted selection from copy mode (o / Ctrl-o)
set -g @plugin 'tmux-plugins/tmux-open'
# yank: copy selection to the system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
# navigator: move between panes with vim keys, no prefix
set -g @plugin 'christoomey/vim-tmux-navigator'
# dracula: Dracula palette + status bar segments
set -g @plugin 'dracula/tmux'
# continuum: autosave sessions, restore them on server start.
# Must load after dracula: dracula overwrites status-right on load,
# and continuum injects its auto-save trigger into status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'
# tmux-fzf: fzf-powered search over windows/history
set -g @plugin 'sainnhe/tmux-fzf'
# tmux-fzf-url: pick a URL from pane/scrollback, open it (prefix u)
set -g @plugin 'wfxr/tmux-fzf-url'
# tmux-thumbs: visual window switcher with pane thumbnails (prefix + space)
set -g @plugin 'fcsonline/tmux-thumbs'

## --- General
# tmux validates default-shell against /etc/shells; zsh lives in
# /bin on old machines, in the nix profile on fresh ones.
if-shell '[ -x /bin/zsh ]' \
    'set -g default-shell /bin/zsh' \
    'set -g default-shell "$HOME/.nix-profile/bin/zsh"'
set -g default-terminal "tmux-256color"
# pi (and other modern tools) read keys through CSI-u.
set -g extended-keys on
set -g extended-keys-format csi-u
# ~100k lines of scrollback per pane.
set -g history-limit 99999
# window names stay what we set them to.
set -g allow-rename off
# window list centred on the status bar.
set -g status-justify centre
# close a window and the rest renumber (no gaps).
set -g renumber-windows on
# closing the last window does not detach the client.
set -g detach-on-destroy off
# System clipboard via OSC 52 (terminal side), on copy-mode selection.
set -g set-clipboard on
# Pass 24-bit color through to the terminal.
set -g terminal-overrides ',xterm-256color:RGB'

## --- Prefix
unbind C-b
set -g prefix C-space
# second prefix: no caps lock required.
bind C-v send-prefix

## --- Session, Windows & panes
set -g base-index 1
set -g pane-base-index 1
# split with | (vertical) and - (horizontal), like vim.
bind | split-window -h
bind - split-window -v
# the old quote/percent splits are noise.
unbind '"'
unbind %
# p: previous window.
bind p previous-window
# click to select, drag to resize.
setw -g mouse on
bind v display-popup -h 30 -w 100 -E "workmux dashboard"

## --- Copy mode (vi keys; 'y' yanks to clipboard via tmux-yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

## --- Cursor
# Dracula purple (#bd93f9), matching the ghostty cursor color.
setw -g cursor-colour colour141

## --- Handy binds
# Reload the config.
bind r source-file "$HOME/.config/tmux/tmux.conf"

## --- fzf-url
set -g @fzf-url-history-limit '2000'
# popup at 60% width / 30% height.
set -g @fzf-url-fzf-options \
    '-p 60%,30% --border-label=" Open URL "'

## --- macOS only (no-ops elsewhere)
if 'command -v reattach-to-user-namespace >/dev/null' \
    'set -gq @osx-pasteboard true'
if 'tmux show -gv @osx-clipboard' \
    'set -g default-command "reattach-to-user-namespace -l $SHELL"'

## --- Resurrect / continuum
# restore vim/nvim through their own session files.
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
# capture pane contents on save so screens restore exactly.
set -g @resurrect-capture-pane-contents 'on'
# re-run these long-lived processes on restore.
set -g @resurrect-processes 'ssh psql mysql'
# autosave every 15 minutes...
set -g @continuum-save-interval '15'
# ...and restore automatically when the server starts.
set -g @continuum-restore 'on'

## --- Dracula theme
# show the seconds until the next continuum save in the status bar.
set -g @dracula-continuum-mode countdown
set -g @dracula-continuum-time-threshold 60
# left segment: hostname.
set -g @dracula-show-left-icon "#h"
# Right-side segments: only the continuum countdown (the i3 bar covers
# battery/network/weather).
set -g @dracula-plugins continuum

## --- TPM (must load before the window-status overrides below)
run '~/.config/tmux/plugins/tpm/tpm'

## --- Window entries (after the plugin, so these win)
# Current window: grey block, green index, white name.
# Inactive windows: purple index, white name.
setw -g window-status-format \
    '#[fg=#6272a4] #[fg=#bd93f9]#I #[fg=#f8f8f2]#W '
setw -g window-status-current-format \
    '#[fg=#6272a4] #[fg=#50fa7b]#I #[fg=#f8f8f2]#W '
setw -g window-status-current-style bg=#6272a4
