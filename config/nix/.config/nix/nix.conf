# User-level nix config — stowed to ~/.config/nix/nix.conf by
# `make install-nix`. Keep only user-level-valid options here;
# settings like build-users-group belong in /etc/nix/nix.conf
# and make nix reject this file if placed here.

# nix-command: the nix profile/workflows plumbing (default on, kept
# explicit). flakes: the flake.nix in this repo (default on in recent
# nix, kept explicit so older installs work too).
experimental-features = nix-command flakes
